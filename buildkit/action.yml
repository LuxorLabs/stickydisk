name: Sticky disk BuildKit
description: Start a BuildKit builder backed by a Tenki sticky disk

inputs:
  key:
    description: Stable cache key
    required: true
  path:
    description: Empty directory to mount for BuildKit state
    required: true
  commit:
    description: Publish a successful job's cache candidate automatically or never
    required: false
    default: auto
  fail-on-error:
    description: Fail the step when cache storage is unavailable
    required: false
    default: "false"
  builder-name:
    description: Buildx builder name
    required: false
  gc-keep-duration:
    description: Prune cache records unused for longer than this Go duration
    required: false
    default: 192h
  gc-keep-bytes:
    description: Keep the layer cache under this many bytes; defaults to 90% of the sticky disk
    required: false
  max-parallelism:
    description: Maximum concurrent BuildKit steps; defaults to the daemon's setting
    required: false

outputs:
  mounted:
    description: Whether storage was mounted
  source:
    description: hit, miss, readonly, or fallback
  generation:
    description: Immutable cache generation when available
  name:
    description: Buildx builder name for Docker actions

runs:
  using: node20
  main: dist/main.js
  post: dist/post.js
  post-if: always()
